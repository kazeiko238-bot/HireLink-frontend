<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Meetings | HireLink
    </title>


    <!-- CSS -->

    <link
        rel="stylesheet"
        href="css/meeting.css"
    >

    <link
        rel="stylesheet"
        href="css/header.css"
    >

    <link
        rel="stylesheet"
        href="css/overlay.css"
    >

    <link
        rel="stylesheet"
        href="css/footer.css"
    >


    <!-- Favicon -->

    <link
        rel="icon"
        type="image/png"
        href="images/logo.png"
    >


    <!-- Google Font -->

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

</head>


<body>


<!-- =====================================================
     HEADER
===================================================== -->

<header class="header">

    <div class="brand">

        <button
            class="back-btn"
            onclick="history.back()"
            type="button"
        >
            &lt;
        </button>


        <h2>
            HireLink
        </h2>

    </div>


    <div
        class="auth-area"
        id="authArea"
    >

        <button
            class="signin-btn"
            id="signInBtn"
            type="button"
        >
            Sign In
        </button>

    </div>

</header>



<!-- =====================================================
     MAIN
===================================================== -->

<main class="meeting-container">


    <div class="meeting-page-header">

        <h1>
            My Meetings
        </h1>

        <p>
            View your scheduled HireLink interviews.
        </p>

    </div>


    <!-- =================================================
         MEETING LIST
    ================================================= -->

    <div
        id="meetingList"
        class="meeting-list"
    >
    </div>


    <!-- =================================================
         EMPTY STATE
    ================================================= -->

    <div
        id="noMeetings"
        class="hidden"
    >
    </div>


</main>



<!-- =====================================================
     LOGIN OVERLAY
===================================================== -->

<div
    id="loginOverlay"
    class="overlay hidden"
>


    <div class="auth-modal">


        <form
            id="login"
            class="auth-form active"
        >


            <h2 class="form-title">
                Welcome Back
            </h2>


            <!-- EMAIL -->

            <div class="form-group">

                <label
                    for="login-email"
                >
                    Email Address
                </label>


                <input
                    type="email"
                    id="login-email"
                    name="email"
                    class="form-control"
                    placeholder="Enter your email"
                    required
                >

            </div>


            <!-- PASSWORD -->

            <div class="form-group">

                <label
                    for="login-password"
                >
                    Password
                </label>


                <input
                    type="password"
                    id="login-password"
                    name="password"
                    class="form-control"
                    placeholder="Enter your password"
                    required
                >


                <div class="forgot-password">

                    <a href="#">
                        Forgot password?
                    </a>

                </div>

            </div>


            <!-- REMEMBER -->

            <div class="remember-me">

                <input
                    type="checkbox"
                    id="remember-me"
                    name="remember"
                >


                <label
                    for="remember-me"
                >
                    Remember me
                </label>

            </div>


            <!-- LOGIN -->

            <button
                type="button"
                class="btn"
                id="loginBtn"
            >
                Login
            </button>


        </form>

    </div>

</div>



<!-- =====================================================
     FOOTER
===================================================== -->

<footer class="site-footer">

    <div class="footer-content">


        <div class="footer-brand">

            <h2 class="footer-logo">
                HIRELINK
            </h2>

            <p class="footer-slogan">
                A click-step away from your career success.
            </p>

        </div>


        <hr class="footer-divider">


        <ul class="footer-links">

            <li>
                <a href="about.html">
                    ABOUT US
                </a>
            </li>


            <li>
                <a href="contact.html">
                    CONTACT
                </a>
            </li>


            <li>
                <a href="terms.html">
                    TERMS OF SERVICE
                </a>
            </li>


            <li>
                <a href="privacy.html">
                    PRIVACY POLICY
                </a>
            </li>

        </ul>


        <div
            id="footer-user-area"
            class="footer-user-area"
        >
        </div>


        <div class="footer-bottom">

            <p>
                &copy; 2026 HireLink.
                All rights reserved.
            </p>

        </div>

    </div>

</footer>



<!-- =====================================================
     JAVASCRIPT
===================================================== -->

<script src="meeting.js"></script>

<script src="footer.js"></script>

<script src="overlay.js"></script>


</body>

</html>
